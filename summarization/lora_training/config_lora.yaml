train:
  seed: 42                                                                # random seed for data shuffle, int
  buffer_size: 10                                                         # buffer size for data shuffle, int
  learning_rate: 1.0e-4                                                   # LoRA could handle lr ~ 1.0e-4
  batch_size: 2
  encoder_max_len: 512
  gradient_accumulation_step: 8                                           # number of steps before updating model parameters, per updates model needs to forward backward pass batch_size * gradient_accumulation samples
  num_epochs: 5                                                           # number of training epoch
  num_train_batch_per_epoch: 2000                                         # total data feeded into training per epoch is num_train_batch_per_epoch * batch_size
  num_dev_batch_per_epoch: 150                                            # total data feeded into eval per epoch is num_dev_batch_per_epoch * batch_size
  model_checkpoint: "google/flan-t5-small" 
  train_data_paths: ['../data/train.01.jsonl', '../data/train.02.jsonl']  # data is from summarization indosum
  dev_data_paths: ['../data/dev.01.jsonl', '../data/dev.02.jsonl']
  base_model_save_path: "base_models/flan-t5-small"
  adapter_save_path: "adapters/flan-t5-small_summarization/"
  lora_config:
    init_lora_weights: "gaussian"
    r: 16
    lora_alpha: 32
    target_modules: ['q', 'v']                                            # flan t5 use [q, v] to target query and value, for other model check model layer name
    lora_dropout: 0.05
    bias: "none"      

test:
  batch_size: 4
  num_batch: 25 # number of data to predict is batch_size * num_batch
  encoder_max_len: 512
  test_data_paths: ['../data/test.01.jsonl', '../data/test.02.jsonl']
  base_model_checkpoint: "base_models/flan-t5-small"
  adapter_path: "adapters/flan-t5-small_summarization/"
  outfile: "../Results/test_data_prediction_lora.jsonl"

merge_model_lora:
  base_model_checkpoint: "base_models/flan-t5-small"
  adapter_path: "adapters/flan-t5-small_summarization/"
  merge_model_save_path: "merged_models/flan-t5-small_indosum_summarization/"

